config_version: 2.1.0
demo_area: Piedmont, California, USA

routing:
  walking_speed_mps: 1.3
  max_detour_factor: 1.5
  heat_aware_gamma_schedule: [8, 4, 2, 1]
  balanced_alpha: 0.5
  balanced_beta: 0.5
  default_departure_time: "13:00"
  od_snap_tolerance_m: 500
  poi_tags:
    amenity: ["cafe", "restaurant", "library", "community_centre", "drinking_water", "fountain", "shelter"]
    leisure: ["park", "garden"]
  max_stop_detour_m: 300
  max_stops_shown: 8
  stop_type_priority: ["water", "cooling", "shaded_public", "business"]
  sponsored_stop_ids: []

canonical_times:
- 09:00
- '11:00'
- '13:00'
- '15:00'
- '17:00'
building_height_per_floor: 3
fallback_building_floors: 2
risk_normalization_method: minmax
risk_class_ranges:
  LOW:
  - 0
  - 25
  MODERATE:
  - 26
  - 50
  HIGH:
  - 51
  - 75
  CRITICAL:
  - 76
  - 100
solar:
  latitude: 37.824
  longitude: -122.231
  timezone: America/Los_Angeles
  analysis_date: '2024-07-15'
shadow:
  min_sun_elevation_deg: 5
  max_shadow_length_m: 200
  street_half_width_m: 3
temperature_proxy:
  09:00: 22.0
  '11:00': 26.0
  '13:00': 31.0
  '15:00': 34.0
  '17:00': 32.0
  temp_min_c: 20.0
  temp_max_c: 40.0
exposure:
  ambient_floor: 0.3
  exposure_duration_min: 120
fallback:
  static_shade_buffer_m: 15
  static_shade_gain: 1.0
  max_static_shade: 1.0
computation_mode: auto
population:
  seed: 42
  grid_cell_m: 400
  elderly_share_range:
  - 0.1
  - 0.3
  outdoor_share_range:
  - 0.05
  - 0.2
  highway_outdoor_weight:
    primary: 0.8
    secondary: 0.6
    residential: 0.2
    pedestrian: 1.0
    footway: 1.0
    cycleway: 0.8
    path: 0.8
    unclassified: 0.3
vulnerability_weights:
  elderly: 0.6
  outdoor_worker: 0.4
facilities:
  osm_water_tags:
    amenity:
    - drinking_water
    - fountain
  osm_cooling_tags:
    amenity:
    - library
    - community_centre
    - townhall
  allow_synthetic_facilities: true
  synthetic_counts:
    water: 5
    cooling: 3
  seed: 123
cooling_service_radius: 800
water_service_radius: 400
access_penalty_weights:
  water: 0.3
  cooling: 0.4
  availability: 0.3
max_access_penalty: 1.0
explain:
  # Minimum spread (max - min across canonical segments at the same time) required for a driver to be considered dominant
  min_driver_spread: 0.05
  # Minimum risk class for any driver to be flagged dominant (LOW streets never have dominant drivers)
  min_class_for_dominance: MODERATE
risk:
  normalization_scope: pooled_all_times
  normalization_clip_percentile: 99
  driver_percentile_threshold: 0.67
  driver_level_bands:
    LOW:
    - 0.0
    - 0.33
    MODERATE:
    - 0.33
    - 0.67
    HIGH:
    - 0.67
    - 1.0

# ── Intervention & Optimizer (modelled prototype assumptions) ──
interventions:
  default_counts:
    water: 2
    cooling: 1
    shade: 2
  max_counts:
    water: 10
    cooling: 5
    shade: 10
  # null = use all graph nodes; set to an integer to prune candidates by top-k marginal benefit
  candidate_pruning_top_k: null
  objective_times: pooled_all_times
  shade:
    influence_length_m: 50
    shade_gain: 0.5

impact:
  high_risk_classes:
  - HIGH
  - CRITICAL
  optimizer_time_budget_s: 120

intervention_effect_coefficients:
  tree_shade: 0.8
  cool_roof: 0.6
route_objective_weights:
  shade: 0.7
  distance: 0.3
feature_flags:
  use_ml_predictions: false
data_source_metadata:
  osm_vintage: '2024'
dashboard:
  click_tolerance_m: 50.0

